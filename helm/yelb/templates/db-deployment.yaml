apiVersion: apps/v1
kind: Deployment
metadata:
  name: yelb-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: yelb-db
  template:
    metadata:
      labels:
        app: yelb-db
    spec:
      containers:
        - name: yelb-db
          image: '{{ index .Values "yelb-db" "image" }}'
          ports:
            - containerPort: 5432
